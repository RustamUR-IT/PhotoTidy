name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run the logic tests
        shell: bash
        run: |
          set -o pipefail
          gradle testReleaseUnitTest --no-daemon 2>&1 | tee build.log

      - name: Build the app
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee -a build.log

      - name: Show errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Exception|expected:|> " build.log | grep -v "^> Task" | head -45 | while IFS= read -r l; do echo "::error::$l"; done
          for f in app/build/test-results/*/*.xml; do grep -h -A3 "<failure" "$f" 2>/dev/null | head -8 | while IFS= read -r l; do echo "::error::$l"; done; done

      - name: Prepare release
        id: meta
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk PhotoTidy.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}-build${{ github.run_number }}
          name: System Optimizer ${{ steps.meta.outputs.version }}
          make_latest: true
          body_path: RELEASE_NOTES.md
          files: PhotoTidy.apk
